name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketbudz
          POSTGRES_PASSWORD: pocketbudz
          POSTGRES_DB: pocketbudz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketbudz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Matches backend/vitest.config.ts, which points the tests at this database.
      DATABASE_URL: postgresql://pocketbudz:pocketbudz@localhost:5432/pocketbudz_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Debug builds don't bundle JS (Metro serves it at runtime), so this
      # never actually gets read — it just guards against that assumption
      # changing later and the build failing on a missing GEMINI_API_KEY.
      - name: Write placeholder .env
        run: |
          {
            echo "GEMINI_API_KEY=ci-placeholder"
            echo "GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com"
            echo "API_BASE_URL=http://10.0.2.2:3000"
          } > .env

      # gradlew's executable bit lives in git's index, independent of the
      # committing machine's filesystem — a commit made from Windows (where
      # there's no real exec bit to preserve) can silently strip it again,
      # which fails here with exit 126, not a clear "permission" message.
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
